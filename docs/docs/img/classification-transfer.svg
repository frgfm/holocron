<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 840 700"><title id="title">Transfer-learning workflow for a custom Holocron classifier</title><desc id="desc">Six numbered steps show checkpoint metadata, loading pretrained weights, replacing the classification head, training with frozen features, optional full-model fine-tuning, and inference with custom labels. Warnings explain that the head must be replaced after loading weights and that original checkpoint categories must not be used for custom outputs. A final note lists trainer checkpoint contents.</desc><defs><marker id="arrow" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4.5"><path d="M0 0 9 4.5 0 9z" class="arrow-head"/></marker></defs><style>.canvas,.card{fill:#faf8fb;stroke:#d9d1dc}.card{fill:#fff}.card-key{fill:#f5edf2;stroke:#a84c7a}.card-optional{fill:#eef8fa;stroke:#0e7490}.body,.code,.note-text,.note-title,.step-title,.title{fill:#2b2430}.subtitle{fill:#675f6a}.step-number{fill:#a84c7a}.step-number-text{fill:#fff}.arrow{fill:none;stroke:#675f6a;stroke-width:3;marker-end:url(#arrow)}.arrow-head{fill:#675f6a}.warning{fill:#fff2f0;stroke:#b42318}.warning-icon,.warning-text{fill:#b42318}.checkpoint-note{fill:#f2eef4;stroke:#9b919f}.saved{fill:#176b45}.omitted{fill:#9b2c22}text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;text-rendering:geometricPrecision}.title{font-size:30px;font-weight:700}.subtitle{font-size:20px}.step-title{font-size:25px;font-weight:700}.body{font-size:21px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px}.step-number-text{font-size:20px;font-weight:700;text-anchor:middle}.warning-text{font-size:20px;font-weight:650}.warning-icon{font-size:25px;font-weight:800;text-anchor:middle}.note-title{font-size:20px;font-weight:700}.note-text{font-size:18px}@media (max-width:500px){.body,.step-title{font-size:22px}.code{font-size:20px}.note-text{font-size:19px}}@media (prefers-color-scheme:dark){.canvas,.card{fill:#171419;stroke:#4d4552}.card{fill:#211d24}.card-key{fill:#2c2028;stroke:#e38ab7}.card-optional{fill:#17272b;stroke:#67e8f9}.body,.code,.note-text,.note-title,.step-title,.title{fill:#f3edf4}.subtitle{fill:#c4bbc7}.step-number{fill:#d978aa}.arrow{stroke:#c4bbc7}.arrow-head{fill:#c4bbc7}.warning{fill:#351c1d;stroke:#ff8a80}.warning-icon,.warning-text{fill:#ff8a80}.checkpoint-note{fill:#28232b;stroke:#655c69}.saved{fill:#7ee2b8}.omitted{fill:#ffaaa3}}</style><rect width="838" height="698" x="1" y="1" class="canvas" rx="16"/><text x="30" y="42" class="title">From published checkpoint to custom classifier</text><text x="30" y="70" class="subtitle">Load the original contract first; customize only after the weights are in place.</text><path d="M250 185H300" class="arrow"/><path d="M530 185H580" class="arrow"/><path d="M700 270V375" class="arrow"/><path d="M590 475H540" class="arrow"/><path d="M310 475H260" class="arrow"/><g><rect width="220" height="170" x="30" y="100" class="card-key" rx="12"/><circle cx="55" cy="126" r="17" class="step-number"/><text x="55" y="133" class="step-number-text">1</text><text x="78" y="134" class="step-title">Checkpoint data</text><text x="50" y="174" class="body">Weights</text><text x="50" y="205" class="body">Input transform</text><text x="50" y="236" class="body">Original labels</text></g><g><rect width="220" height="170" x="310" y="100" class="card" rx="12"/><circle cx="335" cy="126" r="17" class="step-number"/><text x="335" y="133" class="step-number-text">2</text><text x="358" y="134" class="step-title">Load weights</text><text x="330" y="177" class="body">Keep original head</text><text x="330" y="209" class="code">resnet18(</text><text x="330" y="235" class="code">checkpoint=…)</text></g><g><rect width="220" height="170" x="590" y="100" class="card-key" rx="12"/><circle cx="615" cy="126" r="17" class="step-number"/><text x="615" y="133" class="step-number-text">3</text><text x="638" y="134" class="step-title">Replace head</text><text x="610" y="181" class="code">model.head = …</text><text x="610" y="216" class="body">10 → N outputs</text><text x="610" y="246" class="body">after loading</text></g><g><rect width="350" height="54" x="245" y="300" class="warning" rx="10"/><text x="273" y="335" class="warning-icon">×</text><text x="295" y="323" class="warning-text">Load weights before</text><text x="295" y="345" class="warning-text">replacing the head</text></g><g><rect width="220" height="170" x="590" y="390" class="card" rx="12"/><circle cx="615" cy="416" r="17" class="step-number"/><text x="615" y="423" class="step-number-text">4</text><text x="638" y="424" class="step-title">Train new head</text><text x="610" y="470" class="code">freeze_until=</text><text x="610" y="496" class="code">&quot;features&quot;</text><text x="610" y="532" class="body">features stay frozen</text></g><g><rect width="230" height="170" x="310" y="390" class="card-optional" rx="12"/><circle cx="335" cy="416" r="17" class="step-number"/><text x="335" y="423" class="step-number-text">5</text><text x="357" y="424" class="step-title">Optional unfreeze</text><text x="330" y="473" class="body">Fine-tune full model</text><text x="330" y="508" class="code">fit_n_epochs(...)</text><text x="330" y="538" class="body">all weights update</text></g><g><rect width="230" height="170" x="30" y="390" class="card-key" rx="12"/><circle cx="55" cy="416" r="17" class="step-number"/><text x="55" y="423" class="step-number-text">6</text><text x="78" y="424" class="step-title">Save, then infer</text><text x="50" y="471" class="body">Decode outputs with</text><text x="50" y="505" class="code">train_set.classes</text><text x="50" y="536" class="body">your custom labels</text></g><g><rect width="330" height="85" x="30" y="585" class="warning" rx="10"/><text x="57" y="620" class="warning-icon">×</text><text x="80" y="618" class="warning-text">Do not reuse the original</text><text x="80" y="647" class="warning-text">checkpoint categories</text></g><g><rect width="430" height="85" x="380" y="585" class="checkpoint-note" rx="10"/><text x="400" y="614" class="note-title">Trainer checkpoint</text><text x="400" y="641" class="note-text saved">✓ model · epoch · step · best loss</text><text x="400" y="663" class="note-text omitted">× optimizer · scheduler · class names</text></g></svg>
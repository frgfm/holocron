# Unfiltered security entries are separate from version-update allow-lists.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "ci(github)"
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "Europe/Paris"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "daily"
    groups:
      docs-security:
        applies-to: "security-updates"
        patterns:
          - "mkdocs*"
          - "mkdocstrings*"
          - "griffe*"
      tests-security:
        applies-to: "security-updates"
        patterns:
          - "pytest*"
      pytorch-security:
        applies-to: "security-updates"
        patterns:
          - "torch*"
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "main"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Europe/Paris"
    allow:
      - dependency-name: "ruff"
      - dependency-name: "ty"
      - dependency-name: "prek"
      - dependency-name: "uv-build"
    groups:
      quality:
        patterns:
          - "ruff"
          - "ty"
          - "prek"
  - package-ecosystem: "uv"
    directory: "/api"
    open-pull-requests-limit: 0
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "Europe/Paris"
  - package-ecosystem: "docker"
    directory: "/api"
    target-branch: "main"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Europe/Paris"
    allow:
      - dependency-name: "ghcr.io/astral-sh/uv"

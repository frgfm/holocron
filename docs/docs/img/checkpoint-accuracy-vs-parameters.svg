<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 900 690"><title id="title">Imagenette checkpoint accuracy versus parameter count</title><desc id="desc">Scatter plot of 27 comparable Imagenette checkpoints. The horizontal axis is parameter count on a logarithmic scale and the vertical axis is top-one accuracy. A connected ring marks the Pareto frontier, and a diamond marks the default ResNet-18 checkpoint.</desc><style>.canvas{fill:#faf8fb;stroke:#d9d1dc}.plot{fill:#fff;stroke:#9b919f}.grid{stroke:#e5dfe7;stroke-width:1}.axis{stroke:#675f6a;stroke-width:2}.annotation,.label,.tick,.title{fill:#2b2430}.subtitle{fill:#675f6a}.point{fill:#817987;stroke:#fff;stroke-width:2}.frontier-line{fill:none;stroke:#a84c7a;stroke-width:4}.legend-pareto,.pareto .point{fill:#fff;stroke:#a84c7a;stroke-width:4}.default-marker{fill:#0e7490;stroke:#fff;stroke-width:2.5}.leader{fill:none;stroke:#675f6a;stroke-width:1.5}text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;text-rendering:geometricPrecision}.title{font-size:28px;font-weight:700}.subtitle{font-size:18px}.label{font-size:20px;font-weight:650}.annotation,.tick{font-size:18px}.annotation{font-weight:650}@media (max-width:500px){.subtitle,.tick{font-size:21px}.label{font-size:23px}.annotation{font-size:20px}}@media (prefers-color-scheme:dark){.canvas{fill:#171419;stroke:#4d4552}.plot{fill:#211d24;stroke:#655c69}.grid{stroke:#39323c}.axis{stroke:#c4bbc7}.annotation,.label,.tick,.title{fill:#f3edf4}.subtitle{fill:#c4bbc7}.point{fill:#aaa1ad;stroke:#211d24}.frontier-line{stroke:#e38ab7}.pareto .point{fill:#211d24;stroke:#e38ab7}.legend-pareto{fill:#171419;stroke:#e38ab7}.default-marker{fill:#67e8f9;stroke:#211d24}.leader{stroke:#c4bbc7}}</style><rect width="898" height="688" x="1" y="1" class="canvas" rx="16"/><text x="65" y="42" class="title">Imagenette accuracy vs. model size</text><text x="65" y="70" class="subtitle">27 published checkpoints · up and left is
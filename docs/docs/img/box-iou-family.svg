<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 900 800"><title id="title">Geometry of IoU, GIoU, DIoU, and CIoU</title><desc id="desc">Four panels reuse the same solid target box A and dashed prediction box B. IoU highlights their intersection, GIoU adds the unused area in the smallest enclosing box, DIoU adds the distance between box centers, and CIoU adds the mismatch between their width-to-height ratios.</desc><defs><pattern id="overlap-hatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="10" class="overlap-stripe"/></pattern><pattern id="unused-hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="9" class="unused-stripe"/></pattern><marker id="dimension-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="3.5" refY="3.5"><path d="M7 0 0 3.5 7 7z" class="dimension-head"/></marker><g id="box-pair"><rect width="160" height="100" x="0" y="0" class="target-box"/><rect width="160" height="100" x="80" y="50" class="prediction-box"/><text x="10" y="28" class="box-label target-label">A · target</text><text x="104" y="138" class="box-label prediction-label">B · prediction</text></g></defs><style>.canvas,.panel{fill:#faf8fb;stroke:#d9d1dc}.panel{fill:#fff}.box-label,.formula,.geometry-label,.panel-title,.title{fill:#2b2430}.legend,.panel-subtitle,.subtitle{fill:#675f6a}.prediction-box,.target-box{fill:none;stroke-width:5}.target-box{stroke:#a84c7a}.prediction-box{stroke:#0e7490;stroke-dasharray:12 8}.target-label{fill:#7f305a}.prediction-label{fill:#0e6178}.overlap-area{fill:#b979a0;fill-opacity:.3}.enclosure{stroke-width:3}.overlap-stripe{stroke:#7f305a;stroke-width:3}.enclosure{fill:none;stroke:#675f6a;stroke-dasharray:5 6}.unused-area{fill:#f5c96a;fill-opacity:.25}.unused-stripe{stroke:#9a6700;stroke-width:2.5}.center-line,.diagonal,.dimension{fill:none;stroke:#675f6a;stroke-width:3;stroke-dasharray:7 6}.center-dot{fill:#2b2430;stroke:#fff;stroke-width:2}.dimension{marker-start:url(#dimension-arrow);marker-end:url(#dimension-arrow)}.dimension-head{fill:#675f6a}text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;text-rendering:geometricPrecision}.title{font-size:30px;font-weight:700}.subtitle{font-size:19px}.legend{font-size:17px}.panel-title{font-size:27px;font-weight:700}.panel-subtitle{font-size:18px}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;font-weight:650}.box-label{font-size:17px;font-weight:700}.geometry-label{font-size:18px;font-weight:700}@media (max-width:500px){.panel-title{font-size:31px}.panel-subtitle{font-size:20px}.formula{font-size:22px}.box-label{font-size:19px}.geometry-label{font-size:20px}}@media (prefers-color-scheme:dark){.canvas,.panel{fill:#171419;stroke:#4d4552}.panel{fill:#211d24}.box-label,.formula,.geometry-label,.panel-title,.title{fill:#f3edf4}.legend,.panel-subtitle,.subtitle{fill:#c4bbc7}.target-box{stroke:#e38ab7}.prediction-box{stroke:#67e8f9}.target-label{fill:#f1a5cb}.prediction-label{fill:#8cecf8}.overlap-area{fill:#e38ab7;fill-opacity:.22}.overlap-stripe{stroke:#f1a5cb}.center-line,.diagonal,.dimension,.enclosure{stroke:#c4bbc7}.unused-area{fill:#f5c96a;fill-opacity:.16}.unused-stripe{stroke:#ffd778}.center-dot{fill:#f3edf4;stroke:#211d24}.dimension-head{fill:#c4bbc7}}</style><rect width="898" height="798" x="1" y="1" class="canvas" rx="16"/><text x="30" y="43" class="title">One box pair, four increasingly strict comparisons</text><text x="30" y="71" class="subtitle">Each metric keeps overlap, then adds a geometric penalty.</text><text x="552" y="69" class="legend">A: solid target · B: dashed prediction</text><g><rect width="405" height="290" x="30" y="100" class="panel" rx="12"/><text x="55" y="138" class="panel-title">IoU</text><text x="55" y="164" class="panel-subtitle">Overlap relative to the union</text><rect width="80" height="50" x="175" y="235" class="overlap-area"/><rect width="80" height="50" x="175" y="235" fill="url(#overlap-hatch)"/><use x="95" y="185" href="#box-pair"/><text x="215" y="229" class="geometry-label" text-anchor="middle">intersection</text><text x="232.5" y="370" class="formula" text-anchor="middle">IoU = |A ∩ B| / |A ∪ B|</text></g><g><rect width="405" height="290" x="465" y="100" class="panel" rx="12"/><text x="490" y="138" class="panel-title">GIoU</text><text x="490" y="164" class="panel-subtitle">Adds unused enclosing area</text><rect width="80" height="50" x="690" y="185" class="unused-area"/><rect width="80" height="50" x="690" y="185" fill="url(#unused-hatch)"/><rect width="80" height="50" x="530" y="285" class="unused-area"/><rect width="80" height="50" x="530" y="285" fill="url(#unused-hatch)"/><rect width="240" height="150" x="530" y="185" class="enclosure"/><use x="530" y="185" href="#box-pair"/><text x="746" y="215" class="geometry-label">C</text><text x="667.5" y="370" class="formula" text-anchor="middle">GIoU = IoU − unused(C) / |C|</text></g><g><rect width="405" height="340" x="30" y="420" class="panel" rx="12"/><text x="55" y="458" class="panel-title">DIoU</text><text x="55" y="484" class="panel-subtitle">Adds distance between box centers</text><use x="95" y="505" href="#box-pair"/><line x1="95" x2="335" y1="505" y2="655" class="diagonal"/><line x1="175" x2="255" y1="555" y2="605" class="center-line"/><circle cx="175" cy="555" r="6" class="center-dot"/><circle cx="255" cy="605" r="6" class="center-dot"/><text x="203" y="570" class="geometry-label">ρ²</text><text x="302" y="625" class="geometry-label">c²</text><text x="232.5" y="740" class="formula" text-anchor="middle">DIoU = IoU − ρ² / c²</text></g><g><rect width="405" height="340" x="465" y="420" class="panel" rx="12"/><text x="490" y="458" class="panel-title">CIoU</text><text x="490" y="484" class="panel-subtitle">Adds width-to-height agreement</text><use x="530" y="505" href="#box-pair"/><line x1="536" x2="684" y1="495" y2="495" class="dimension"/><line x1="520" x2="520" y1="511" y2="599" class="dimension"/><line x1="616" x2="764" y1="665" y2="665" class="dimension"/><line x1="780" x2="780" y1="561" y2="649" class="dimension"/><text x="610" y="490" class="geometry-label" text-anchor="middle">w₁</text><text x="511" y="559" class="geometry-label" text-anchor="end">h₁</text><text x="690" y="688" class="geometry-label" text-anchor="middle">w₂</text><text x="788" y="609" class="geometry-label">h₂</text><text x="667.5" y="740" class="formula" text-anchor="middle">CIoU = DIoU − αv</text></g></svg>